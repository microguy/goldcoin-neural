[package]
name = "goldcoin-neural-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependency
goldcoin-neural-core = { path = "../core" }

# ONNX Runtime for model inference (simplified for initial build)
# ort = { version = "2.0.0-rc.2", features = ["cuda", "tensorrt"] }

# Candle for lightweight ML (simplified for initial build) 
# candle-core = "0.3"
# candle-nn = "0.3"
# candle-transformers = "0.3"

# Tokenization (simplified for initial build)
# tokenizers = "0.15"

# Vector database (simplified for initial build)
# qdrant-client = "1.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Math
ndarray = "0.15"
nalgebra = "0.32"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }