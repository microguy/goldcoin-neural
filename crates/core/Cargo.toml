[package]
name = "goldcoin-neural-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core functionality
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
bitcoin = "0.31"
secp256k1 = "0.28"
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.1"

# Storage (simplified for initial build)
# rocksdb = "0.21"
# sled = "0.34"

# Networking (simplified for initial build)
# libp2p = "0.53"
# quinn = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utils
bytes = "1.5"
hex = "0.4"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4", "serde"] }